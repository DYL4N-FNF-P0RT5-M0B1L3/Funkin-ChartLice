name: Build FNF 0.8.5 Android

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configurar Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Instalar HMM
        run: |
          haxelib install hmm

      - name: Instalar dependencias de FNF
        run: |
          haxelib run hmm install

      - name: Configurar Lime para Android
        run: |
          haxelib run lime setup android

      - name: Compilar FNF para Android
        run: |
          haxelib run lime build android -release -v
        timeout-minutes: 120

      - name: Buscar APK
        run: |
          echo "Buscando APK..."
          find export -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-0.8.5-Android
          path: export/**/*.apk
          if-no-files-found: error
