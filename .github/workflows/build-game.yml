name: Build FNF 0.8.5 Android

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    name: Build FNF Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout FNF source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Verify tools
        run: |
          echo "=== Java ==="
          java -version

          echo "=== Haxe ==="
          haxe version

          echo "=== Haxelib ==="
          haxelib version

          echo "=== Lime ==="
          haxelib list | grep lime || true

          echo "=== Android ==="
          adb --version

      - name: Configure Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install FNF dependencies
        run: |
          haxelib run hmm install

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Build Android APK
        run: |
          haxelib run lime build android -release -v
        timeout-minutes: 120

      - name: Find generated APK
        run: |
          echo "=== Searching for APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: FNF-0.8.5-Android
          path: |
            export/**/*.apk
            export/**/*.aab
          if-no-files-found: error
